services:
  - type: web
    name: hangman-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python populate_db.py
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    plan: starter
    envVars:
      - key: DB_PATH
        value: /data/hangman.db
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: hangman-storage
      mountPath: /data
      sizeGB: 1
