services:
  - type: web
    name: hangman-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python populate_db.py && gunicorn server:app
    plan: starter
    envVars:
      - key: DB_PATH
        value: /data/hangman.db
      - key: ADMIN_KEY
        sync: false # set this manually in the Render dashboard, never commit it
    disk:
      name: hangman-storage
      mountPath: /data
      sizeGB: 1  # this is new render fix
