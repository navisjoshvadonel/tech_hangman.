services:
  - type: web
    name: hangman-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python populate_db.py
    startCommand: >
      gunicorn server:app
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 120
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 100
      --worker-class gthread
      --log-level info
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: DB_PATH
        value: hangman.db
      - key: ADMIN_KEY
        generateValue: true
      - key: PYTHON_UNBUFFERED
        value: "1"

